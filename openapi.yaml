openapi: 3.1.0
info:
  title: Stipes OpenAI Chat API
  version: 1.0.0
  description: |
    Minimal HTTP API exposing health, embedded files, and a chat endpoint backed by OpenAI Responses API.

    Deployment note: on Vercel the same contract is served under the /api prefix
    (/api/healthz, /api/files, /api/chat); unmatched paths fall through to the chat
    function. The Vercel chat function prepends a formatting instruction to the
    message before calling OpenAI, so outputs can differ from the standalone server.
servers:
  - url: http://localhost:8080
    description: Standalone server (go run ./cmd/server)
paths:
  /healthz:
    get:
      summary: Health check
      description: Method is not enforced; any HTTP method returns the same 200 response.
      operationId: healthz
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
              example: { ok: true }

  /files:
    get:
      summary: List embedded files
      description: Method is not enforced; any HTTP method returns the same 200 response.
      operationId: listFiles
      responses:
        '200':
          description: Map of filename to content or binary note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResponse'
              examples:
                sample:
                  value:
                    files:
                      stipes.md: "# Chris Stipes\n..."
                      resume.md: "# Resume\nSkills: Go, APIs, OpenAI\n..."

  /chat:
    post:
      summary: Chat with the assistant
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: "Write a short bio of Chris"
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                output: "Chris is a software engineer..."
        '400':
          description: Invalid JSON
          content:
            text/plain:
              schema:
                type: string
              example: "invalid json: unexpected EOF"
        '502':
          description: Downstream OpenAI error
          content:
            text/plain:
              schema:
                type: string
              example: "openai error: OPENAI_API_KEY is not set"
        '405':
          description: Method not allowed (non-POST). Empty body.

components:
  schemas:
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          description: |
            minLength is documented intent only — the server currently accepts
            empty or missing messages. Unknown request fields are silently ignored.
      required: [message]

    ChatResponse:
      type: object
      properties:
        output:
          type: string
      required: [output]

    FilesResponse:
      type: object
      properties:
        files:
          type: object
          additionalProperties:
            type: string
      required: [files]
